<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ecuación de Segundo Grado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Tu CSS -->
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>
<div class="container">

    <header class="header text-center">
        <h1><i class="bi bi-calculator"></i> Ecuación de Segundo Grado</h1>
        <p class="lead">Resolución usando el discriminante</p>
    </header>

    <div class="exercise-card">
        <div class="exercise-body">

            <div class="instructions">
                <h4><i class="bi bi-info-circle"></i> Instrucciones</h4>
                <ul class="instructions-list">
                    <li>Ingresa los valores de a, b y c</li>
                    <li>El programa evaluará el discriminante</li>
                    <li>Se mostrarán las soluciones si existen</li>
                </ul>
            </div>

            <div class="row">
                <div class="col-md-6">

                    <label class="form-label">Valor de a</label>
                    <input type="number" class="form-control mb-3" id="a">

                    <label class="form-label">Valor de b</label>
                    <input type="number" class="form-control mb-3" id="b">

                    <label class="form-label">Valor de c</label>
                    <input type="number" class="form-control mb-3" id="c">

                    <button class="btn btn-custom w-100" onclick="resolver()">
                        <i class="bi bi-play-circle"></i> Resolver
                    </button>

                </div>

                <div class="col-md-6">
                    <div id="resultado"></div>
                </div>
            </div>

        </div>
    </div>

    <footer class="footer">
        <small>Front-End Trainee · Talento Digital</small>
    </footer>

</div>

<script src="app8.js"></script>
</body>
</html>
